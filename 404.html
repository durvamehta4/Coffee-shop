<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Ember &amp; Bean</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #fffaf3; --text: #2b1d16; --muted: #6e5a4e; --caramel: #a15c28; --on: #fff; --cup: #4a3226; --surface: #fff; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15100c; --text: #f3e9dc; --muted: #b8a393; --caramel: #e0a36c; --on: #1e1611; --cup: #d9b994; --surface: #281c15; } }
    :root[data-theme="dark"] { --bg: #15100c; --text: #f3e9dc; --muted: #b8a393; --caramel: #e0a36c; --on: #1e1611; --cup: #d9b994; --surface: #281c15; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; text-align: center; }
    main { max-width: 520px; }
    svg { width: min(300px, 80vw); height: auto; }
    .spill { animation: spread 1.6s ease-out both; transform-box: fill-box; transform-origin: 0% 50%; }
    @keyframes spread { from { transform: scaleX(0.2); opacity: 0; } }
    .cup { animation: wobble 1s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: 30% 100%; }
    @keyframes wobble { from { transform: rotate(-35deg); } }
    @media (prefers-reduced-motion: reduce) { .spill, .cup { animation: none; } }
    h1 { font-family: "Playfair Display", serif; font-size: clamp(2.2rem, 7vw, 3.2rem); margin: 0.5rem 0; }
    p { color: var(--muted); line-height: 1.6; }
    .eyebrow { text-transform: uppercase; letter-spacing: 0.15em; font-size: 0.8rem; font-weight: 600; color: var(--caramel); margin: 0; }
    .btn { display: inline-block; margin-top: 1rem; padding: 0.8rem 1.6rem; border-radius: 999px; background: var(--caramel); color: var(--on); font-weight: 600; text-decoration: none; }
    nav { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1.5rem; }
    nav a { padding: 0.5rem 1rem; border-radius: 999px; background: var(--surface); color: var(--text); text-decoration: none; font-size: 0.9rem; box-shadow: 0 6px 20px rgba(43,29,22,.08); }
    nav a:hover, nav a:focus-visible { outline: 2px solid var(--caramel); }
  </style>
  <script>try { var t = localStorage.getItem("eb-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <main>
    <svg viewBox="0 0 300 200" role="img" aria-label="A tipped-over coffee cup with a spill">
      <ellipse class="spill" cx="190" cy="178" rx="100" ry="11" fill="#5e3317" opacity=".85"/>
      <g class="cup"><g transform="translate(-28 22) rotate(90 150 128)">
        <path d="M110 80h80l-8 90a8 8 0 0 1-8 7h-48a8 8 0 0 1-8-7z" fill="var(--bg)" stroke="var(--cup)" stroke-width="5" stroke-linejoin="round"/>
        <path d="M190 100c22 0 22 40-4 40" fill="none" stroke="var(--cup)" stroke-width="5"/>
        <path d="M116 86h68" stroke="#5e3317" stroke-width="7" stroke-linecap="round"/>
      </g></g>
    </svg>
    <p class="eyebrow">Error 404</p>
    <h1>This page spilled.</h1>
    <p>We couldn't find what you were looking for. It may have moved, or the link has a typo. The coffee, luckily, is right where we left it.</p>
    <a class="btn" href="./#menu">Order ahead →</a>
    <nav aria-label="Popular pages">
      <a href="./#menu">Menu</a><a href="./#find">Find your cup</a><a href="./#beans">Beans</a><a href="./#gifts">Gift cards</a><a href="./#visit">Hours &amp; map</a>
    </nav>
  </main>
</body>
</html>
